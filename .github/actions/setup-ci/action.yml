name: Set up NaviJac CI
description: Install the pinned, published Jac toolchain and test dependencies
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'
    - name: Install pinned Python dependencies
      shell: bash
      run: python -m pip install --disable-pip-version-check -r ci/requirements.txt
